<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <title>Todo</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <h1>Todo</h1>
  <form id="add-form">
    <input id="title" name="title" type="text" maxlength="200" required placeholder="New task" autocomplete="off">
    <input id="due" name="due" type="date" aria-label="Due date">
    <input id="tags" name="tags" type="text" maxlength="200" placeholder="Tags, comma separated" autocomplete="off">
    <label>Priority
      <select id="priority" name="priority" aria-label="Priority">
        <option value="high">High</option>
        <option value="medium" selected>Medium</option>
        <option value="low">Low</option>
      </select>
    </label>
    <label><input id="repeat-daily" type="checkbox"> Repeats daily</label>
    <button type="submit">Add</button>
  </form>
  <div class="filters">
    <label>Show
      <select id="status-filter">
        <option value="all">All</option>
        <option value="open">Incomplete</option>
        <option value="done">Completed</option>
      </select>
    </label>
    <label>Tag
      <select id="tag-filter">
        <option value="">All tags</option>
      </select>
    </label>
    <label>Priority
      <select id="priority-filter">
        <option value="">All priorities</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
    </label>
  </div>
  <p id="empty" class="empty" hidden>No tasks yet.</p>
  <p id="error" class="error" hidden></p>
  <ul id="list"></ul>
  <footer id="counts" class="counts" aria-live="polite">0 open · 0 done</footer>
  <script type="module" src="./app.js"></script>
</body>
</html>
