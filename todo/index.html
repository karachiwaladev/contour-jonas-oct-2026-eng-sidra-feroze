<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 36rem; margin: 2rem auto; padding: 0 1rem; }
    form, .filters { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
    input, select { padding: 0.5rem; }
    #title, #tags { flex: 1; min-width: 8rem; }
    button { padding: 0.5rem 0.75rem; }
    ul { list-style: none; padding: 0; margin: 1rem 0 0; }
    li { display: flex; align-items: flex-start; gap: 0.5rem; padding: 0.5rem 0; border-bottom: 1px solid #ddd; }
    li.done .title { text-decoration: line-through; color: #666; }
    .body { flex: 1; min-width: 0; }
    .title { overflow-wrap: anywhere; }
    .meta { color: #555; font-size: 0.9rem; margin-top: 0.2rem; }
    .actions { display: flex; flex-direction: column; gap: 0.25rem; }
    .edit-series { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-top: 0.25rem; }
    .empty, .error { color: #666; }
    .error { color: #8a1f1f; }
  </style>
</head>
<body>
  <h1>Todo</h1>
  <form id="add-form">
    <input id="title" name="title" type="text" maxlength="200" required placeholder="New task" autocomplete="off">
    <input id="due" name="due" type="date" aria-label="Due date">
    <input id="tags" name="tags" type="text" maxlength="200" placeholder="Tags, comma separated" autocomplete="off">
    <label>Priority
      <select id="priority" name="priority" aria-label="Priority">
        <option value="high">High</option>
        <option value="medium" selected>Medium</option>
        <option value="low">Low</option>
      </select>
    </label>
    <label><input id="repeat-daily" type="checkbox"> Repeats daily</label>
    <button type="submit">Add</button>
  </form>
  <div class="filters">
    <label>Show
      <select id="status-filter">
        <option value="all">All</option>
        <option value="open">Incomplete</option>
        <option value="done">Completed</option>
      </select>
    </label>
    <label>Tag
      <select id="tag-filter">
        <option value="">All tags</option>
      </select>
    </label>
    <label>Priority
      <select id="priority-filter">
        <option value="">All priorities</option>
        <option value="high">High</option>
        <option value="medium">Medium</option>
        <option value="low">Low</option>
      </select>
    </label>
  </div>
  <p id="empty" class="empty" hidden>No tasks yet.</p>
  <p id="error" class="error" hidden></p>
  <ul id="list"></ul>
  <script type="module" src="./app.js"></script>
</body>
</html>
